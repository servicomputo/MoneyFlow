<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2f1"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Wallet icon -->
  <g transform="translate(14, 16)">
    <!-- Wallet body -->
    <rect x="0" y="4" width="36" height="24" rx="4" fill="url(#wallet)"/>
    <!-- Wallet flap -->
    <path d="M0 8 Q0 4 4 4 L28 4 Q32 4 32 8 L32 10 L0 10 Z" fill="#a7f3d0"/>
    <!-- Wallet button -->
    <circle cx="28" cy="16" r="2.5" fill="#10b981"/>
    <!-- Money flow arrows (subtle) -->
    <path d="M6 18 L10 18 M8 16 L10 18 L8 20" stroke="#10b981" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 18 L22 18 M20 16 L18 18 L20 20" stroke="#0d9488" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
